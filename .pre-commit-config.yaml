# .pre-commit-config.yaml — pre-commit hooks configuration (prek)
# Docs: https://prek.j178.dev/configuration/
# The manual stage is the CI set: CI runs `prek run --all-files --hook-stage manual`.

minimum_prek_version: "0.3.2"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  # Builtin hooks — fast, offline, Rust-native
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  # Conventional Commits — enforce Conventional Commit message format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Secret / credential leak guard — fixtures and dotfiles must never carry tokens.
  # Local only: it scans --staged, so it finds nothing under --all-files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # Workflow linters
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  # Shared edbfi CI policy hooks
  - repo: https://github.com/edbfi/edbfi-ci
    rev: d07ccc13141d4aee4fa28546f4328f4e48d5363b  # frozen: v0.1.0
    hooks:
      - id: privileged-jobs

  # Local hooks — project-specific quality gates
  - repo: local
    hooks:
      - id: content-contract
        name: Repository content contract
        entry: python3 scripts/check-content.py
        language: system
        pass_filenames: false
        always_run: true
      - id: docendo-tests
        name: Docendo plan validator tests
        entry: python3 -I -B -m unittest discover -s docendo/docendo-orchestrate-bricks/tests
        language: system
        pass_filenames: false
        files: ^docendo/docendo-orchestrate-bricks/
      - id: coding-guidelines-tests
        name: Coding guidelines builder validator tests
        entry: python3 -I -B -m unittest discover -s coding-guidelines/coding-guidelines-builder/tests
        language: system
        pass_filenames: false
        files: ^coding-guidelines/coding-guidelines-builder/
      # node --check reads only its first file argument, so check one file per call.
      - id: node-check
        name: node --check
        entry: sh -c 'rc=0; for f; do node --check "$f" || rc=1; done; exit "$rc"' --
        language: system
        files: \.mjs$
