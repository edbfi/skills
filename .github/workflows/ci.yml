name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.1.3
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
  content:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: j178/prek-action@v3.0.0
        with:
          # renovate: datasource=github-releases depName=j178/prek
          prek-version: 0.5.3
          extra-args: --all-files
        env:
          SKIP: no-commit-to-branch
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [guard, content]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.1.3
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: edbfi/automation/actions/gate@v1.1.3
        with:
          needs: ${{ toJSON(needs) }}
          required: guard content
