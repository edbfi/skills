name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: j178/prek-action@v3.0.0
        with:
          # renovate: datasource=github-releases depName=j178/prek
          prek-version: 0.5.3
          extra-args: --all-files
        env:
          SKIP: no-commit-to-branch
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [content]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.1.1
        with:
          needs: ${{ toJSON(needs) }}
          required: content
